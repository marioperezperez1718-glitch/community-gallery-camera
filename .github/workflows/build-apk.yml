name: Build Samsung APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        run: gradle --no-daemon :gallerycamera:assembleDebug :demo:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp gallerycamera/build/outputs/apk/debug/gallerycamera-debug.apk dist/GalleryCamera-debug.apk
          cp demo/build/outputs/apk/debug/demo-debug.apk dist/GalleryCameraDemo-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload Samsung package
        uses: actions/upload-artifact@v4
        with:
          name: Community-Gallery-Camera-Samsung
          path: dist/
          if-no-files-found: error
